name: ✅ Check
on:
    workflow_dispatch:
    push:
        branches:
            - main
            - '1.*'
    pull_request:
        types:
            - opened
            - reopened
            - synchronize
            - ready_for_review

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: write
    checks: write

jobs:
    lint:
        name: 🔬 ESLint
        runs-on: ubuntu-latest
        timeout-minutes: 10
        if: ${{ !github.event.pull_request.draft || github.event_name == 'push' }}
        steps:
            - name: 📥 Checkout repo
              uses: actions/checkout@v7

            - name: ⚙️ Setup node
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            - name: 📥 Download deps
              run: npm ci

            - name: 🔬 Lint
              uses: wearerequired/lint-action@548d8a7c4b04d3553d32ed5b6e91eb171e10e7bb # v2
              with:
                  eslint: true
                  eslint_args: "**/*.{mjs,ts,tsx}"
                  prettier: true
                  prettier_args: "--config ./.prettierrc.json \"**/*.{js,json,ts,tsx,css,md,html}\""


    typecheck:
        name: 🏷️ Typecheck
        timeout-minutes: 10
        runs-on: ubuntu-latest
        if: ${{ !github.event.pull_request.draft || github.event_name == 'push' }}
        steps:
            - name: 📥 Checkout repo
              uses: actions/checkout@v7

            - name: ⚙️ Setup node
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            - name: 📥 Download deps
              run: npm ci

            - name: 🏷️ Typecheck
              run: npm run typecheck

    test-app:
        name: 🔎 Test
        runs-on: ubuntu-latest
        timeout-minutes: 10
        if: ${{ !github.event.pull_request.draft || github.event_name == 'push' }}
        steps:
            - name: 📥 Checkout repo
              uses: actions/checkout@v7

            - name: ⚙️ Setup node
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            - name: 📥 Download deps
              run: npm ci

            # Navegadores de Playwright en caché, con clave por la versión de @playwright/test
            # del package-lock: solo se descargan cuando cambia la versión.
            - name: 🎭 Playwright version
              id: playwright
              run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

            - name: 🎭 Cache Playwright browsers
              id: playwright-cache
              uses: actions/cache@v4
              with:
                  path: ~/.cache/ms-playwright
                  key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

            - name: 🎭 Install Playwright browsers
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: npx playwright install chromium-headless-shell 1>/dev/null

            - name: 🔎 Unit Tests on App
              run: CI=1 npm run test:unit:app -- --run
            - name: 🔎 Unit Tests on Supabase functions
              run: CI=1 npm run test:unit:functions -- --run

    # E2E de TekFusion (e2e/tekfusion, playwright.tekfusion.config.ts) contra el Supabase
    # local (puerto 54321) con el seed ficticio. Los e2e de Atomic se borraron (docs/10).
    e2e-test:
        name: 🎭 E2E TekFusion
        timeout-minutes: 20
        runs-on: ubuntu-latest
        if: ${{ !github.event.pull_request.draft || github.event_name == 'push' }}
        steps:
            - name: 📥 Checkout repo
              uses: actions/checkout@v7

            - name: ⚙️ Setup node
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            - name: 📥 Download deps
              run: npm ci

            - name: 🎭 Playwright version
              id: playwright
              run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

            - name: 🎭 Cache Playwright browsers
              id: playwright-cache
              uses: actions/cache@v4
              with:
                  path: ~/.cache/ms-playwright
                  key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

            - name: 🎭 Install Playwright browsers
              if: steps.playwright-cache.outputs.cache-hit != 'true'
              run: npx playwright install --with-deps chromium-headless-shell 1>/dev/null

            # Con acierto de caché los navegadores ya están, pero las dependencias del sistema
            # (apt) no se guardan en ~/.cache/ms-playwright: se instalan igual.
            - name: 🎭 Install Playwright system deps
              if: steps.playwright-cache.outputs.cache-hit == 'true'
              run: npx playwright install-deps chromium-headless-shell 1>/dev/null

            # supabase/functions/.env está en .gitignore. Se genera con los valores locales no
            # secretos de su .env.example (la función `users`, que guarda el Perfil, lo necesita;
            # PURGE_CRON_SECRET es el valor de prueba que usa e2e/tekfusion/purga-adjuntos.spec.ts).
            # La clave publicable sale de `supabase status`, y el edge runtime lee el archivo al
            # crearse: por eso se levanta, se escribe el .env y se reinicia.
            - name: 🗄️ Start Supabase + supabase/functions/.env
              run: |
                  npx supabase start -x studio,imgproxy,logflare,vector
                  KEY=$(npx supabase status -o env | sed -n 's/^PUBLISHABLE_KEY="\{0,1\}\([^"]*\)"\{0,1\}$/\1/p')
                  test -n "$KEY" || { echo "supabase status no entregó PUBLISHABLE_KEY"; exit 1; }
                  printf '%s\n' \
                      "SB_JWT_ISSUER=http://127.0.0.1:54321/auth/v1" \
                      "SB_PUBLISHABLE_KEY=$KEY" \
                      "CRM_BASE_URL=http://localhost:5180" \
                      "PURGE_CRON_SECRET=solo-para-e2e-local" > supabase/functions/.env
                  npx supabase stop
                  npx supabase start -x studio,imgproxy,logflare,vector

            - name: 🎭 E2E
              run: CI=1 npm run test:e2e

            - name: 🛑 Stop Supabase
              if: always()
              run: npx supabase stop --no-backup

    build:
        name: 🔨 Build
        timeout-minutes: 10
        runs-on: ubuntu-latest
        if: ${{ !github.event.pull_request.draft || github.event_name == 'push' }}
        steps:
            - name: 📥 Checkout repo
              uses: actions/checkout@v7

            - name: ⚙️ Setup node
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            - name: 📥 Download deps
              run: npm ci

            - name: 🔨 Build
              run: npm run build
